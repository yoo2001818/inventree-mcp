<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory plan review</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: transparent;
        color: CanvasText;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 12px; }
      main { display: grid; gap: 12px; max-width: 760px; margin: 0 auto; }
      header, section, footer {
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 12px;
        padding: 14px;
        background: color-mix(in srgb, Canvas 94%, CanvasText 6%);
      }
      h1 { margin: 0 0 4px; font-size: 1.2rem; }
      h2 { margin: 0 0 8px; font-size: 1rem; }
      p { margin: 4px 0; line-height: 1.45; }
      .muted { opacity: .7; font-size: .86rem; }
      .summary { white-space: pre-wrap; margin: 0; font: inherit; line-height: 1.45; }
      .step { display: grid; grid-template-columns: 2rem 1fr; gap: 8px; }
      .step-number {
        display: grid; place-items: center; width: 1.7rem; height: 1.7rem;
        border-radius: 999px; background: color-mix(in srgb, Highlight 18%, transparent);
        color: CanvasText; font-weight: 700;
      }
      .outputs { margin: 8px 0 0; padding-left: 1.1rem; font-size: .88rem; opacity: .8; }
      .warning { border-color: color-mix(in srgb, #d97706 55%, transparent); }
      .confirm { display: flex; gap: 9px; align-items: flex-start; cursor: pointer; }
      .confirm input { margin-top: .25rem; }
      .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
      button {
        appearance: none; border: 0; border-radius: 9px; padding: .7rem 1rem;
        background: Highlight; color: HighlightText; font-weight: 700; cursor: pointer;
      }
      button:disabled { opacity: .45; cursor: not-allowed; }
      #status { min-height: 1.4em; font-size: .9rem; }
      #status.error { color: #dc2626; }
      #status.success { color: #16a34a; font-weight: 650; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Inventory plan review</h1>
        <p id="plan-meta" class="muted">Waiting for the plan…</p>
      </header>
      <div id="steps"></div>
      <section id="warning" class="warning" hidden>
        <h2>Execution boundary</h2>
        <p>This plan contains multiple upstream operations. They execute serially and are not one InvenTree database transaction. A failure can leave earlier operations completed.</p>
      </section>
      <footer id="approval" hidden>
        <label class="confirm">
          <input id="confirmed" type="checkbox">
          <span>I reviewed every change above and want to commit this inventory plan.</span>
        </label>
        <div class="actions">
          <button id="commit" type="button" disabled>Commit inventory plan</button>
          <span id="status" role="status" aria-live="polite"></span>
        </div>
      </footer>
    </main>
    <script type="module" src="./plan-review.ts"></script>
  </body>
</html>
